{% extends "layout.html" %}
{% block body %}
<h1>表单</h1>
{% if flash %}<p class="flash">{{ flash }}</p>{% endif %}
<form method="post" action="/form">
  <label>标题 <input id="title" name="title" value="{{ field_title }}"></label>
  <label>数量 <input id="quantity" name="quantity" type="number" value="{{ quantity }}"></label>
  <label>城市
    <select id="city" name="city">
      <option value="">请选择</option>
      {% for item in cities %}
      <option value="{{ item }}" {% if item == city %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>
  </label>
  <div>是否加急</div>
  <label class="choice"><input id="rush-true" type="radio" name="rush" value="true" {% if rush == "true" %}checked{% endif %}> true</label>
  <label class="choice"><input id="rush-false" type="radio" name="rush" value="false" {% if rush == "false" %}checked{% endif %}> false</label>
  <label>备注 <textarea id="note" name="note" rows="3">{{ note }}</textarea></label>
  <button type="submit">提交</button>
</form>
{% endblock %}
