[project]
name = "solidus"
version = "0.1.0"
description = "固相线：人守着账本，Agent 只起草，脚本只走 Telegram。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.55",
    "playwright>=1.48",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.6",
    "telethon>=1.37",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
solidus = "solidus.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
